# Render Blueprint for the NexHire API. Secrets are entered in the Render dashboard, never in git.
services:
  - type: web
    name: nexhire-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Safe with one instance. Move migrations to a pre-deploy step before running several.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: CORS_ORIGINS
        sync: false
      - key: DAILY_INTERVIEWS
        value: "3"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
